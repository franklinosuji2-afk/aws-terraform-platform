name: terraform-apply

# Manual only. The job runs in the "dev" GitHub environment, which should be
# configured with required reviewers, so every apply needs a human approval.
# Only that environment can assume the apply role (see bootstrap trust policy).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "apply or destroy"
        type: choice
        options:
          - apply
          - destroy
        default: apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.10.5"
  AWS_REGION: eu-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        working-directory: envs/dev
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Apply
        if: inputs.action == 'apply'
        working-directory: envs/dev
        run: terraform apply -input=false -auto-approve -lock-timeout=60s

      - name: Destroy
        if: inputs.action == 'destroy'
        working-directory: envs/dev
        run: terraform destroy -input=false -auto-approve -lock-timeout=60s

      - name: Show outputs
        if: inputs.action == 'apply'
        working-directory: envs/dev
        run: terraform output